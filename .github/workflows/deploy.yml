name: Terraform Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  terraform:
    name: Terraform Plan and Apply (Dev)
    runs-on: ubuntu-latest

    # Uses 'dev' environment secrets from GitHub Settings -> Environments -> dev
    environment: dev

    defaults:
      run:
        working-directory: environments/dev

    env:
      ACTIONS_STEP_DEBUG: true
      TF_VAR_gcp_credentials_file: ${{ env.GOOGLE_GHA_CREDS_PATH }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dump environment variables
        run: env | sort

      - name: Print debug info
        run: |
          echo "WIP=${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          echo "SA=${{ secrets.SERVICE_ACCOUNT_EMAIL }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          audience: sts.googleapis.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan