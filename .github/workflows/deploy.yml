name: Terraform Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Plan and Apply (Dev)
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: environments/dev

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dump environment variables
        run: env | sort

      - name: Print debug info
        run: |
          echo "WIP=${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          echo "SA=${{ secrets.SERVICE_ACCOUNT_EMAIL }}"

      ###########################################################################
      # 1. Authenticate to Google Cloud using Workload Identity Federation
      ###########################################################################
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          audience: sts.googleapis.com

      ###########################################################################
      # 2. Export the WIF credential file so Terraform backend can use it
      ###########################################################################
      - name: Export Terraform backend credentials
        run: echo "TF_VAR_gcp_credentials_file=${GOOGLE_GHA_CREDS_PATH}" >> $GITHUB_ENV

      ###########################################################################
      # 3. Install Terraform
      ###########################################################################
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      ###########################################################################
      # 4. Terraform Init (now uses correct backend credentials)
      ###########################################################################
      - name: Terraform Init
        run: terraform init

      ###########################################################################
      # 5. Terraform Plan
      ###########################################################################
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      ###########################################################################
      # 6. Terraform Apply
      ###########################################################################
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
