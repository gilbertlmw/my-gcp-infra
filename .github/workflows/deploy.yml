name: Terraform Deploy to GCP

on:
  push:
    branches: [main, dev, test]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - prod

jobs:
  terraform:
    name: Terraform Plan and Apply (${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }})
    runs-on: ubuntu-latest

    # Determine environment name from manual input or branch name
    env:
      ENV_NAME: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}
      ACTIONS_STEP_DEBUG: true

    # Pull environment-specific secrets dynamically from GitHub Environments
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}

    defaults:
      run:
        working-directory: environments/${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name) }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dump environment variables
        run: env | sort

      - name: Print debug info
        run: |
          echo "Deploying to environment: ${{ env.ENV_NAME }}"
          echo "WIP=${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          echo "SA=${{ secrets.SERVICE_ACCOUNT_EMAIL }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          audience: sts.googleapis.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan